<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Match</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Match</h1>

  <h2>
    <span th:text="${username}"></span>
    V.S.
    <span th:text="${opponent.name}"></span>
  </h2>

  <a th:href="@{/fight(id=${opponent.id}, hand='Gu')}">ぐー</a>
  <a th:href="@{/fight(id=${opponent.id}, hand='Choki')}">ちょき</a>
  <a th:href="@{/fight(id=${opponent.id}, hand='Pa')}">ぱー</a>

  <p>あなたの手 <span th:text="${myHand}"></span></p>
  <p>相手の手 <span th:text="${opponentHand}"></span></p>
  <p>結果 <span th:text="${result}"></span></p>

  <a href="/janken">もどる</a>
</body>

</html>
