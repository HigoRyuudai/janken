<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Match</title>
</head>

<body>
  <a href="/logout">ログアウト</a>

  <h1>Match</h1>

  <h2>
    <span th:text="${username}"></span>
    V.S.
    <span th:text="${opponent.name}"></span>
  </h2>

  <a th:href="@{/wait(id=${opponent.id}, hand='Gu')}">ぐー</a>
  <a th:href="@{/wait(id=${opponent.id}, hand='Choki')}">ちょき</a>
  <a th:href="@{/wait(id=${opponent.id}, hand='Pa')}">ぱー</a>

  <a href="/janken">もどる</a>
</body>

</html>
