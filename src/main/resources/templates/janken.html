<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <title>じゃんけん</title>
</head>

<body>
  <div th:if="${username}">
    Hi <span th:text="${username}"></span>
  </div>

  <h2>じゃんけん</h2>

  <p>あなたの手を選んでください。</p>

  <a href="/jankengame?hand=グー">グー</a>
  <a href="/jankengame?hand=チョキ">チョキ</a>
  <a href="/jankengame?hand=パー">パー</a>

  <div th:if="${janken}">
    <p>
      あなたの手：
      <span th:text="${janken.myHand}"></span>
    </p>

    <p>
      相手の手：
      <span th:text="${janken.cpuHand}"></span>
    </p>

    <p>
      結果：
      <span th:text="${janken.result}"></span>
    </p>
  </div>

  <hr>
  
  <h2>エントリー</h2>

  <ul>
    <li th:each="user : ${users}">
      <span th:text="${user.name}"></span>
    </li>
  </ul>


  <hr>

  <form th:action="@{/logout}" method="post" onsubmit="return confirm('Are you sure you want to logout?');">
    <button type="submit">ログアウト</button>
  </form>

</body>

</html>
